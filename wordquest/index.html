<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Official information and legal pages for Word Quest.">
  <title>Word Quest</title>
  <style>
    :root { color-scheme: light; --ink: #172033; --muted: #5b6578; --accent: #5a43c6; --line: #e5e8f0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f7fb; color: var(--ink); font: 16px/1.65 system-ui, -apple-system, Segoe UI, sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 8vh auto; padding: clamp(24px, 6vw, 52px); background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 16px 48px #1c25400c; }
    .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; }
    h1 { margin: 8px 0 12px; font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 1.1; }
    p { color: var(--muted); }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    a { display: inline-block; color: #fff; background: var(--accent); padding: 12px 18px; border-radius: 10px; font-weight: 700; text-decoration: none; }
    a.secondary { color: var(--accent); background: #f0edff; }
    footer { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
    .draft { border-left: 4px solid #d18a00; background: #fff7e5; padding: 12px 15px; border-radius: 6px; color: #684600; font-size: .92rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">A word puzzle adventure</div>
    <h1>Word Quest</h1>
    <p>Welcome to Word Quest, a word puzzle game by Obsidixz. This site provides information about the game and its privacy practices.</p>

    <nav aria-label="Legal information">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a class="secondary" href="terms-of-service.html">Terms of Service</a>
    </nav>
    <footer>Word Quest · Obsidixz</footer>
  </main>
</body>
</html>
